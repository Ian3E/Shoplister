<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shoplister</title>
  <style>
    :root {
      color-scheme: light dark;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --bg: #ffffff;
      --border: #d2d2d7;
      --link: #0066cc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #f5f5f7;
        --muted: #a1a1a6;
        --bg: #000000;
        --border: #424245;
        --link: #2997ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
    }
    main {
      max-width: 42rem;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }
    h1 {
      font-size: 2rem;
      line-height: 1.15;
      margin: 0 0 0.75rem;
    }
    p { margin: 0 0 0.75rem; }
    ul { padding-left: 1.25rem; }
    a { color: var(--link); }
    footer {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Shoplister</h1>
    <p>Grocery list and home inventory for iOS.</p>
    <ul>
      <li><a href="support.html">Support</a></li>
      <li><a href="privacy.html">Privacy Policy</a></li>
    </ul>
    <footer>Shoplister</footer>
  </main>
</body>
</html>
